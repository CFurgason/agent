<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hourly Activity | Call Agent Dashboard</title>
    <link rel="stylesheet" href="styles.css?v=50" />
  </head>
  <body class="activity-page">
    <header class="topbar">
      <div>
        <p class="eyebrow">Call Agent Dashboard</p>
        <h1>Hourly activity</h1>
      </div>
      <div class="top-actions">
        <nav class="page-nav" aria-label="Dashboard pages">
          <a href="index.html">Overview</a>
          <a class="active" href="hourly.html">Hourly table</a>
        </nav>
        <button id="refreshButton" class="icon-button" type="button" aria-label="Refresh sheet data" title="Refresh sheet data">
          <span aria-hidden="true">&#8635;</span>
        </button>
      </div>
    </header>

    <main>
      <section class="controls" aria-label="Hourly activity filters">
        <label class="agent-picker-label">
          Agents
          <div class="agent-picker" id="agentFilter">
            <button id="agentFilterButton" class="agent-filter-button" type="button" aria-haspopup="true" aria-expanded="false">
              All agents
            </button>
            <div id="agentFilterMenu" class="agent-filter-menu" role="group" aria-label="Agent choices"></div>
          </div>
        </label>
        <fieldset class="period-control">
          <legend>Date range</legend>
          <div class="segmented" role="group" aria-label="Date range presets">
            <button class="period-button" type="button" data-period="day">Day</button>
            <button class="period-button active" type="button" data-period="week">Week</button>
            <button class="period-button" type="button" data-period="month">Month</button>
          </div>
        </fieldset>
        <div class="date-range">
          <label>
            Start date
            <input id="startDateFilter" type="date" />
          </label>
          <label>
            End date
            <input id="endDateFilter" type="date" />
          </label>
        </div>
      </section>

      <section id="statusPanel" class="status" role="status"></section>

      <section class="layout activity-page-layout">
        <div class="panel activity-panel activity-page-panel">
          <div class="section-title">
            <h2 id="timeBreakdownTitle">Hourly activity</h2>
            <span id="timeBreakdownLabel"></span>
          </div>
          <div id="timeBreakdown" class="table-wrap"></div>
        </div>
      </section>
    </main>

    <script src="app.js?v=50"></script>
  </body>
</html>
