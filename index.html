<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Who Is Calling Which Shop | Call Agent Dashboard</title>
    <link rel="stylesheet" href="styles.css?v=37" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Call Agent Dashboard</p>
        <h1>Who is making calls at which shop?</h1>
      </div>
      <div class="top-actions">
        <nav class="page-nav" aria-label="Dashboard pages">
          <a class="active" href="index.html">Dashboard</a>
          <a href="compare.html">Compare agents</a>
        </nav>
        <button id="refreshButton" class="icon-button" type="button" aria-label="Refresh sheet data" title="Refresh sheet data">
          <span aria-hidden="true">&#8635;</span>
        </button>
      </div>
    </header>

    <main>
      <section class="controls" aria-label="Dashboard filters">
        <label>
          Agent
          <select id="agentFilter"></select>
        </label>
        <fieldset class="period-control">
          <legend>Date range</legend>
          <div class="segmented" role="group" aria-label="Date range presets">
            <button class="period-button" type="button" data-period="day">Day</button>
            <button class="period-button active" type="button" data-period="week">Week</button>
            <button class="period-button" type="button" data-period="month">Month</button>
          </div>
        </fieldset>
        <fieldset class="period-control">
          <legend>Breakdown</legend>
          <div class="segmented" role="group" aria-label="Time breakdown">
            <button class="breakdown-button active" type="button" data-breakdown="hourly">Hourly</button>
            <button class="breakdown-button" type="button" data-breakdown="daily">Daily</button>
            <button class="breakdown-button" type="button" data-breakdown="weekly">Weekly</button>
          </div>
        </fieldset>
        <div class="date-range">
          <label>
            Start date
            <input id="startDateFilter" type="date" />
          </label>
          <label>
            End date
            <input id="endDateFilter" type="date" />
          </label>
        </div>
      </section>

      <section id="statusPanel" class="status" role="status"></section>

      <section class="metric-grid" aria-label="Summary metrics">
        <article>
          <span>Total calls</span>
          <strong id="totalCalls">0</strong>
        </article>
        <article>
          <span>Active agents</span>
          <strong id="agentCount">0</strong>
        </article>
        <article>
          <span>Active shops</span>
          <strong id="shopCount">0</strong>
        </article>
        <article>
          <span>Top agent/shop</span>
          <strong id="topPair">--</strong>
        </article>
      </section>

      <section class="layout">
        <div class="panel panel-wide focus-panel">
          <div class="section-title">
            <h2>Agent by shop call map</h2>
            <span id="matrixLabel"></span>
          </div>
          <div id="agentShopMatrix" class="matrix-wrap"></div>
        </div>

        <div class="panel panel-wide flow-panel">
          <div class="section-title">
            <h2 id="agentFlowTitle">Agent call flow</h2>
            <span id="agentFlowLabel"></span>
          </div>
          <div id="agentFlow" class="agent-flow"></div>
        </div>

        <div class="panel activity-panel">
          <div class="section-title">
            <h2 id="timeBreakdownTitle">Hourly activity</h2>
            <span id="timeBreakdownLabel"></span>
          </div>
          <div id="timeBreakdown" class="table-wrap"></div>
        </div>

        <div class="panel pair-panel">
          <div class="section-title">
            <h2>Busiest caller/shop pairs</h2>
            <span id="pairLabel"></span>
          </div>
          <div id="agentShopPairs" class="pair-list"></div>
        </div>

      </section>
    </main>

    <script src="app.js?v=37"></script>
  </body>
</html>
