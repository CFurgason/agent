<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Call Agent Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Call Agent Dashboard</p>
        <h1>Call activity by agent, shop, and task</h1>
      </div>
      <div class="top-actions">
        <nav class="page-nav" aria-label="Dashboard pages">
          <a class="active" href="index.html">Dashboard</a>
          <a href="compare.html">Compare agents</a>
        </nav>
        <button id="refreshButton" class="icon-button" type="button" aria-label="Refresh sheet data" title="Refresh sheet data">
          <span aria-hidden="true">&#8635;</span>
        </button>
      </div>
    </header>

    <main>
      <section class="controls" aria-label="Dashboard filters">
        <label>
          Agent
          <select id="agentFilter"></select>
        </label>
        <fieldset class="period-control">
          <legend>Date range</legend>
          <div class="segmented" role="group" aria-label="Date range presets">
            <button class="period-button" type="button" data-period="day">Day</button>
            <button class="period-button active" type="button" data-period="week">Week</button>
            <button class="period-button" type="button" data-period="month">Month</button>
          </div>
        </fieldset>
        <div class="date-range">
          <label>
            Start date
            <input id="startDateFilter" type="date" />
          </label>
          <label>
            End date
            <input id="endDateFilter" type="date" />
          </label>
        </div>
      </section>

      <section id="statusPanel" class="status" role="status"></section>

      <section class="metric-grid" aria-label="Summary metrics">
        <article>
          <span>Total calls</span>
          <strong id="totalCalls">0</strong>
        </article>
        <article>
          <span>Shops reached</span>
          <strong id="shopCount">0</strong>
        </article>
        <article>
          <span>Task types</span>
          <strong id="taskCount">0</strong>
        </article>
        <article>
          <span>Top shop</span>
          <strong id="topShop">--</strong>
        </article>
      </section>

      <section class="layout">
        <div class="panel">
          <div class="section-title">
            <h2>Calls by shop</h2>
            <span id="rangeLabel"></span>
          </div>
          <div id="shopChart" class="rank-list"></div>
        </div>

        <div class="panel">
          <div class="section-title">
            <h2>8-hour call volume</h2>
            <span id="volumeLabel">8 AM - 4 PM</span>
          </div>
          <div id="volumeBreakdown" class="volume-list"></div>
        </div>

        <div class="panel">
          <div class="section-title">
            <h2>Calls by task type</h2>
            <span id="taskLabel"></span>
          </div>
          <div id="taskChart" class="rank-list"></div>
        </div>

        <div class="panel">
          <div class="section-title">
            <h2>Call log</h2>
            <span id="logLabel"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Agent</th>
                  <th>Shop</th>
                  <th>Task type</th>
                </tr>
              </thead>
              <tbody id="callLog"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
