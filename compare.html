<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compare Agents | Call Agent Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Call Agent Dashboard</p>
        <h1>Compare call agents</h1>
      </div>
      <div class="top-actions">
        <nav class="page-nav" aria-label="Dashboard pages">
          <a href="index.html">Dashboard</a>
          <a class="active" href="compare.html">Compare agents</a>
        </nav>
        <button id="refreshButton" class="icon-button" type="button" aria-label="Refresh sheet data" title="Refresh sheet data">
          <span aria-hidden="true">&#8635;</span>
        </button>
      </div>
    </header>

    <main>
      <section class="controls compare-controls" aria-label="Comparison filters">
        <label>
          Agents
          <div id="compareAgentChoices" class="check-list"></div>
        </label>
        <fieldset class="period-control">
          <legend>Date range</legend>
          <div class="segmented" role="group" aria-label="Date range presets">
            <button class="period-button" type="button" data-period="day">Day</button>
            <button class="period-button active" type="button" data-period="week">Week</button>
            <button class="period-button" type="button" data-period="month">Month</button>
          </div>
        </fieldset>
        <div class="date-range">
          <label>
            Start date
            <input id="startDateFilter" type="date" />
          </label>
          <label>
            End date
            <input id="endDateFilter" type="date" />
          </label>
        </div>
      </section>

      <section id="statusPanel" class="status" role="status"></section>

      <section id="compareSummary" class="metric-grid" aria-label="Comparison summary"></section>

      <section class="layout compare-layout">
        <div class="panel">
          <div class="section-title">
            <h2>Agent comparison</h2>
            <span>selected agents</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Agent</th>
                  <th>Calls</th>
                  <th>Shops</th>
                  <th>Task types</th>
                  <th>Top shop</th>
                  <th>Top task</th>
                </tr>
              </thead>
              <tbody id="compareTable"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="section-title">
            <h2>Shop overlap</h2>
            <span>top shops</span>
          </div>
          <div id="compareShopMatrix" class="matrix-wrap"></div>
        </div>

        <div class="panel">
          <div class="section-title">
            <h2>Task mix</h2>
            <span>top task types</span>
          </div>
          <div id="compareTaskMatrix" class="matrix-wrap"></div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
